[package]
name = "hermes-rust"
version = "1.0.0"
edition = "2021"
description = "Hermes Agent Desktop, rewritten in Rust — multi-agent AI desktop client with a tiny footprint and instant launch"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/HermesRust"
keywords = ["ai", "agent", "desktop", "llm", "hermes"]
categories = ["gui", "web-programming::http-server"]

[[bin]]
name = "hermes-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
open = "5"
dirs = "5"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
