# HermesRust — Build & Release workflow
# ---------------------------------------------------------------
# • Every push to main (and every manual run) builds native binaries for
#   Windows, macOS and Linux. The ready-to-run bundles appear as
#   downloadable "Artifacts" at the bottom of the Actions run page —
#   no build tools needed on your machine.
# • Push a tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) and the
#   bundles are additionally attached to a GitHub Release.
#
# The Windows job produces:
#   HermesRust-windows-x86_64.zip   (hermes-rust.exe + config/ + ui/)

name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: exe
            platform: windows
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            platform: linux
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            platform: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            platform: macos-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          BIN="hermes-rust"
          NAME="HermesRust-${VER}-${{ matrix.platform }}"
          mkdir -p "pack/HermesRust/config" "pack/HermesRust/ui"
          cp "target/${{ matrix.target }}/release/${BIN}" "pack/HermesRust/"
          cp -r config/* "pack/HermesRust/config/"
          cp -r ui/* "pack/HermesRust/ui/"
          cp README.md STRUCTURE.md LICENSE "pack/HermesRust/" 2>/dev/null || true
          chmod +x "pack/HermesRust/${BIN}"
          cd pack && zip -r "../${NAME}.zip" HermesRust && cd ..
          mkdir -p dist && mv "${NAME}.zip" dist/

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VER = $env:GITHUB_REF_NAME; if (-not $VER) { $VER = "dev" }
          $NAME = "HermesRust-$VER-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "pack/HermesRust/config","pack/HermesRust/ui" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/hermes-rust.exe" "pack/HermesRust/"
          Copy-Item "config/*" "pack/HermesRust/config/" -Recurse -Force
          Copy-Item "ui/*" "pack/HermesRust/ui/" -Recurse -Force
          Copy-Item "README.md","STRUCTURE.md","LICENSE" "pack/HermesRust/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "pack/HermesRust" -DestinationPath "$NAME.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "$NAME.zip" "dist/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesRust-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
